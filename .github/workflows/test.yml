name: Portable pipeline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
  media:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional CPU media adapters
        run: python -m pip install -r skills/story-production/scripts/requirements-media.txt -r skills/story-production/scripts/requirements-delivery.txt
      - name: Run all tests including actual media and OTIO
        run: python -m unittest discover -s tests -v
  epub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify generated book with pinned official EPUBCheck
        run: python tests/run_epubcheck.py --workdir "$RUNNER_TEMP/story-epubcheck"
