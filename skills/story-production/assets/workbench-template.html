<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ · 制作工作台</title>
<style>
:root{--ink:#1d2a30;--paper:#f2efe7;--panel:#fffdf7;--line:#d9d3c7;--accent:#965332;--night:#182b32}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.8 system-ui,'Microsoft YaHei',sans-serif}button,input,select{font:inherit}button{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:7px 13px;color:var(--ink)}button:disabled{opacity:.5;cursor:default}button.active{background:var(--accent);color:white}header{background:var(--night);padding:38px max(5vw,20px);color:#f8f4e8}header h1{font-size:36px;letter-spacing:3px;margin:8px 0}header p{max-width:1000px;color:#d0d8d6}.kicker{font-size:11px;letter-spacing:2px;color:#c9b58d}.stats{display:flex;gap:24px;flex-wrap:wrap}.stats b{font-size:25px}.stats span{font-size:12px;margin-left:7px;color:#c4d0ce}.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px max(5vw,20px);background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}main{max-width:1260px;margin:auto;padding:30px 24px 70px}h2{font-size:25px;margin:0 0 18px}h3{margin:22px 0 12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:23px;margin:16px 0}.controls{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.controls input,.controls select{padding:8px;border:1px solid var(--line);border-radius:5px;background:#fff;max-width:100%}.controls input{flex:1;min-width:150px}.meta{font-size:12px;color:#67767b}.tc{font:13px ui-monospace,Consolas,monospace}.shothead{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}.shothead strong{color:var(--accent);font-size:18px}.anchors,.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.anchor{background:#eee8dc;border-left:3px solid var(--accent);padding:13px;font-size:13px}.anchor b{display:block;font-size:11px;color:#6b7476}.dialogue{border-left:2px solid #af987c;padding:8px 18px;background:#f3eee3}.dialogue p{margin:5px 0}.prose{max-width:850px;margin:auto;font:18px/2 'SimSun',Georgia,serif}.prose .speech{margin:15px 8% 22px}.speech strong{display:block;font:13px/1.8 system-ui;color:var(--accent)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.85 ui-monospace,'Microsoft YaHei',monospace;background:#ece7dd;padding:18px;border-radius:5px;max-height:500px;overflow:auto}.notes{white-space:pre-wrap;overflow-wrap:anywhere}.row{display:grid;grid-template-columns:90px 1fr;gap:10px;font-size:13px;margin:8px 0}.row b{color:#68777b;font-weight:500}.pager{display:flex;justify-content:center;align-items:center;gap:16px;margin:22px 0}details{margin-top:15px}summary{cursor:pointer;color:var(--accent)}.copy{float:right;font-size:12px}.notice{padding:16px;background:#e6dece;font-size:13px}.downloads a{display:block;padding:12px 0;border-bottom:1px solid var(--line);color:var(--accent)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}.empty{padding:40px;text-align:center;color:#68777b}[hidden]{display:none!important}footer{font-size:12px;color:#6d7879;border-top:1px solid var(--line);padding:25px;text-align:center}@media(max-width:700px){.anchors,.grid{grid-template-columns:1fr}header h1{font-size:29px}main{padding:22px 14px}.card{padding:17px}.tabs{position:static}.prose{font-size:17px}.row{grid-template-columns:1fr}.stats{gap:15px}}@media print{header,.tabs,.controls,.pager,.copy,footer{display:none}main{padding:0}.card{break-inside:avoid}.prose{max-width:none}}
</style></head>
<body><header><div class="kicker">ORIGINAL STORY / PRODUCTION DESIGN</div><h1>__TITLE__</h1><p id="logline"></p><div id="stats" class="stats"></div><p class="meta" style="color:#bcc9c8">完整输入的剧作与文字分镜。秒数为预剪辑值；图像、视频、声音均未生成。</p></header>
<nav class="tabs" aria-label="工作区"><button data-view="overview" class="active">故事与制作</button><button data-view="script">完整剧本</button><button data-view="shots">秒级分镜</button><button data-view="assets">角色与资产</button><button data-view="voice">对白时间轴</button><button data-view="files">下载文件</button></nav>
<main><section id="overview"></section>
<section id="script" hidden><div class="controls"><label for="scriptScene">阅读场次</label><select id="scriptScene"></select></div><article id="scriptBody" class="prose"></article><div class="pager"><button id="previousScene">上一场</button><span id="sceneCount"></span><button id="nextScene">下一场</button></div></section>
<section id="shots" hidden><h2>秒级导演分镜</h2><div class="controls"><input id="query" aria-label="搜索分镜" placeholder="搜索镜号、台词、人物或道具"><select id="sceneFilter" aria-label="筛选场次"></select><input id="timeQuery" aria-label="定位时间" placeholder="mm:ss 或 hh:mm:ss" style="max-width:200px"><button id="jump">定位</button></div><p id="resultCount" class="meta" aria-live="polite"></p><div id="sceneDesign"></div><div id="shotList"></div><div class="pager"><button id="previousPage">上一页</button><span id="pageCount"></span><button id="nextPage">下一页</button></div></section>
<section id="assets" hidden></section><section id="voice" hidden></section><section id="files" hidden></section>
</main><footer>所有导出以同一权威输入构建。改动镜头、台词、衣装或时间后，应重新构建对应制作文件。</footer>
<script id="projectData" type="application/json">__DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('projectData').textContent),P=D.package,M=P.meta;
const $=s=>document.querySelector(s),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paragraphs=s=>String(s??'').split(/\n\s*\n/).map(x=>'<p>'+escape(x).replace(/\n/g,'<br>')+'</p>').join('');
const duration=s=>Math.floor(s/60)+'分'+(Math.round((s%60)*1000)/1000)+'秒';
let page=0,currentScene=1,filtered=[];const pageSize=12;
const shots=new Map(P.shots.map(s=>[s.id,s])),clips=new Map();
P.clips.forEach(c=>{if(!clips.has(c.shot))clips.set(c.shot,[]);clips.get(c.shot).push(c)});
const assetMap=new Map([...P.assets.characters,...P.assets.props].map(a=>[a.id,a]));
$('#logline').textContent=M.logline;
$('#stats').innerHTML=`<div><b>${P.scenes.length}</b><span>场</span></div><div><b>${P.shots.length}</b><span>镜</span></div><div><b>${escape(duration(M.story_seconds))}</b><span>正片设计</span></div><div><b>${M.fps}</b><span>fps</span></div>`;
const options=P.scenes.map(s=>`<option value="${s.scene}">${String(s.scene).padStart(2,'0')} ${escape(s.heading)}</option>`).join('');
$('#scriptScene').innerHTML=options;$('#sceneFilter').innerHTML='<option value="0">全片</option>'+options;
function show(name){document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!==name);document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));if(name==='script')renderScript();if(name==='shots')renderShots();if(name==='voice')renderVoice()}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));
function renderScript(){const s=P.scenes[currentScene-1];let out=`<h2>${String(s.scene).padStart(2,'0')} ${escape(s.heading)}</h2><p class="meta">${escape(s.story_day)} · ${escape(s.in_tc)} · 分镜规划 ${escape(duration(s.budget_sec))}</p>`;
P.shots.filter(x=>x.scene===currentScene).forEach(x=>{out+=paragraphs(x.picture);x.dialogue.forEach(d=>out+=`<div class="speech"><strong>${escape(d.speaker)}</strong>${paragraphs(d.text)}</div>`)});
$('#scriptBody').innerHTML=out;$('#scriptScene').value=String(currentScene);$('#sceneCount').textContent=currentScene+' / '+P.scenes.length;$('#previousScene').disabled=currentScene===1;$('#nextScene').disabled=currentScene===P.scenes.length}
$('#scriptScene').onchange=()=>{currentScene=Number($('#scriptScene').value);renderScript()};$('#previousScene').onclick=()=>{currentScene--;renderScript()};$('#nextScene').onclick=()=>{currentScene++;renderScript()};
function design(s){return `<details class="card"><summary>第${s.scene}场共同设计</summary>${[['叙事','intent'],['空间','space'],['轴线','axis'],['灯光','light'],['表演','performance'],['连续','continuity']].map(([a,b])=>`<div class="row"><b>${a}</b><span>${escape(s[b])}</span></div>`).join('')}</details>`}
function shotCard(s){const c=clips.get(s.id)||[];return `<article class="card" id="${escape(s.id)}"><div class="shothead"><strong>${escape(s.id)}</strong><span class="tc">${escape(s.in_tc)} → ${escape(s.out_tc_exclusive)} · ${s.duration_sec}秒</span></div><p class="meta">${escape(s.scene_heading)} · ${escape(s.size)} / ${s.lens_mm_equiv}mm / ${escape(s.camera)}</p><p>${escape(s.picture)}</p>${s.dialogue.length?'<div class="dialogue">'+s.dialogue.map(d=>`<p><b>${escape(d.speaker)}</b>：${escape(d.text)}</p>`).join('')+'</div>':''}<div class="anchors"><p class="anchor"><b>首帧 · 文字锚点</b>${escape(s.first_anchor)}</p><p class="anchor"><b>尾帧 · 文字锚点</b>${escape(s.last_anchor)}</p></div>${[['声音','sound'],['剪辑','transition'],['镜内连续','special'],['实际地点','effective_location'],['制作方法','strategy']].map(([a,b])=>`<div class="row"><b>${a}</b><span>${escape(s[b])}</span></div>`).join('')}<p class="meta">可见：${escape(s.asset_ids.map(id=>id+' '+(assetMap.get(id)?.name||'')).join('、')||'批准环境')}<br>声音：${escape(s.voice_asset_ids.join('、')||'环境音')}</p>${s.pure_post?'<div class="notice">纯后期镜，占成片时间，不提交新视频生成。</div>':`<details><summary>图像与视频提示词 · ${c.length}个建议生成单元</summary><button class="copy" data-copy="${s.id}:image">复制首帧</button><button class="copy" data-copy="${s.id}:prompt">复制整镜</button><pre>${escape(s.prompt)}</pre><p class="meta">${escape(s.negative_prompt)}</p>${c.map(x=>`<details><summary>${escape(x.id)} · 镜内${x.shot_local_in_sec}—${x.shot_local_out_sec}秒</summary><button class="copy" data-clip="${x.id}">复制本段</button><pre>${escape(x.prompt)}</pre></details>`).join('')}</details>`}</article>`}
function renderShots(){const q=$('#query').value.trim().toLowerCase(),n=Number($('#sceneFilter').value);filtered=P.shots.filter(s=>(!n||s.scene===n)&&(!q||[s.id,s.picture,s.sound,...s.asset_ids.map(id=>assetMap.get(id)?.name||id),...s.dialogue.map(d=>d.speaker+' '+d.text)].join(' ').toLowerCase().includes(q)));const pages=Math.max(1,Math.ceil(filtered.length/pageSize));page=Math.max(0,Math.min(page,pages-1));$('#resultCount').textContent=`${filtered.length}镜 · 出点不含该帧 · ${M.fps}fps · 当前第${page+1}页`;$('#sceneDesign').innerHTML=n?design(P.scenes[n-1]):'';$('#shotList').innerHTML=filtered.slice(page*pageSize,(page+1)*pageSize).map(shotCard).join('')||'<div class="empty">没有匹配镜头。</div>';$('#pageCount').textContent=(page+1)+' / '+pages;$('#previousPage').disabled=page===0;$('#nextPage').disabled=page===pages-1}
$('#query').addEventListener('input',()=>{page=0;renderShots()});$('#sceneFilter').onchange=()=>{page=0;renderShots()};$('#previousPage').onclick=()=>{page--;renderShots()};$('#nextPage').onclick=()=>{page++;renderShots()};
$('#jump').onclick=()=>{const input=$('#timeQuery').value.trim();if(!/^\d+:\d{2}(?::\d{2})?$/.test(input)){$('#resultCount').textContent='请输入 mm:ss 或 hh:mm:ss。';return}const parts=input.split(':').map(Number);if(parts.slice(1).some(n=>n>59)){$('#resultCount').textContent='分秒字段需小于60。';return}const t=parts.reduce((a,b)=>a*60+b,0),s=P.shots.find(s=>s.start_sec<=t&&t<s.end_sec);if(!s){$('#resultCount').textContent='该时刻不在正片范围。';return}$('#query').value=s.id;$('#sceneFilter').value='0';page=0;renderShots()};
async function copyText(value,button){try{await navigator.clipboard.writeText(value);button.textContent='已复制'}catch{const area=document.createElement('textarea');area.value=value;area.style.width='100%';area.style.height='180px';button.parentNode.appendChild(area);area.focus();area.select();button.textContent='请复制已选中的文字'}}
document.addEventListener('click',event=>{const b=event.target.closest('[data-copy],[data-clip]');if(!b)return;if(b.dataset.copy){const [id,mode]=b.dataset.copy.split(':');const s=shots.get(id);copyText(mode==='image'?s.image_prompt:s.prompt,b)}else{const c=P.clips.find(x=>x.id===b.dataset.clip);copyText(c.prompt,b)}});
function renderVoice(){const d=P.dialogues.filter(x=>x.scene===currentScene);$('#voice').innerHTML=`<h2>第${currentScene}场对白</h2><p class="notice">区间为未录音前的设计值。完整录音后校准，重复原声使用同一母文件。</p><div class="tablewrap"><table><thead><tr><th>镜号 / 人物</th><th>入秒—出秒</th><th>实际台词与录制规则</th></tr></thead><tbody>${d.map(x=>`<tr><td>${escape(x.shot)}<br>${escape(x.speaker)}</td><td>${x.start_sec}—${x.end_sec}</td><td>${escape(x.text)}<br><small>${escape(x.note)}</small></td></tr>`).join('')}</tbody></table></div><div class="pager"><button id="voicePrevious">上一场</button><span>${currentScene} / ${P.scenes.length}</span><button id="voiceNext">下一场</button></div>`;$('#voicePrevious').disabled=currentScene===1;$('#voiceNext').disabled=currentScene===P.scenes.length;$('#voicePrevious').onclick=()=>{currentScene--;renderVoice()};$('#voiceNext').onclick=()=>{currentScene++;renderVoice()}}
function renderAssets(){let out='';const names={appearance:'外形',voice:'声音',age:'年龄',want:'目标',need:'需要',arc:'弧线',costumes:'衣装',design:'外观',flow:'流转',geography:'空间',look:'美术'};for(const [label,key] of [['人物','characters'],['道具','props'],['地点','locations']]){out+='<h2>'+label+'</h2><div class="grid">'+P.assets[key].map(a=>`<article class="card"><p class="meta">${escape(a.id)}</p><h3>${escape(a.name)}</h3>${Object.entries(a).filter(([k])=>!['id','name'].includes(k)).map(([k,v])=>`<div class="row"><b>${escape(names[k]||k)}</b><span>${typeof v==='object'?Object.entries(v).map(([x,y])=>escape(x)+'：'+escape(y)).join('<br>'):escape(v)}</span></div>`).join('')}</article>`).join('')+'</div>'}$('#assets').innerHTML=out}
$('#overview').innerHTML=`<h2>${escape(P.creative.genre)}</h2><p>${escape(P.creative.theme)}</p><details class="card"><summary>完整梗概（含结局）</summary>${paragraphs(P.creative.synopsis)}</details><div class="grid"><div class="card"><h3>先读完整剧本</h3><p>逐场阅读实际动作与对白，核对人物选择、情绪变化与结局。</p><button id="startScript">开始阅读</button></div><div class="card"><h3>再看逐镜制作</h3><p>检查摄影、空间、首尾帧与声音，再使用批准参考图和配音做动态预演。</p><button id="startShots">打开分镜</button></div></div><h3>导演与AI制作总纲</h3><article class="card notes">${escape(D.notes)}</article><div class="notice">片尾另计${M.credits_seconds}秒。${escape(P.credits.picture)}<br>本工具不会生成视频、购买服务或发布作品。</div>`;
$('#startScript').onclick=()=>show('script');$('#startShots').onclick=()=>show('shots');
$('#files').innerHTML='<h2>下载制作文件</h2><p>保持所有导出在同一目录，可离线打开本工作台。</p><div class="card downloads">'+D.files.map(f=>`<a href="${escape(f.path)}" download>${escape(f.label)}</a>`).join('')+'</div><p class="meta">PDF和Excel由独立导出器创建。此工作台只链接已生成的核心文件，不冒称可选格式已经存在。</p>';
renderScript();renderShots();renderAssets();
</script></body></html>
